<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Invoice ingestion{% endblock %}</title>
  <script src="/static/htmx.min.js"></script>
  <style>
    :root { --ink: #1f2933; --muted: #616e7c; --line: #d9e2ec; --accent: #2457a6; --warn: #b44d12; --bad: #a61b1b; --ok: #1b7a3d; }
    body { font-family: system-ui, sans-serif; color: var(--ink); max-width: 1100px; margin: 0 auto; padding: 1.5rem 1rem; line-height: 1.45; }
    header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--line); margin-bottom: 1.5rem; }
    header a { color: inherit; text-decoration: none; font-weight: 600; }
    table { border-collapse: collapse; width: 100%; }
    .table-wrap { overflow-x: auto; max-width: 100%; }
    header { gap: 1rem; flex-wrap: wrap; }
    th, td { text-align: left; padding: .45rem .6rem; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-size: .85rem; color: var(--muted); font-weight: 600; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .message { padding: .75rem 1rem; border-left: 4px solid var(--bad); background: #fdf2f2; margin-bottom: 1rem; }
    .note { padding: .75rem 1rem; border-left: 4px solid var(--warn); background: #fdf6ee; margin: .5rem 0; }
    .status { font-size: .85rem; padding: .1rem .5rem; border-radius: 999px; background: #eef2f7; white-space: nowrap; }
    .muted { color: var(--muted); }
    .line-row.no-match { background: #fdf2f2; }
    .line-row.flagged .flag, .flag { color: var(--warn); font-weight: 600; }
    .changed { color: var(--accent); font-size: .85rem; }
    .picker { display: flex; gap: .3rem; flex-wrap: wrap; }
    .picker select, .picker input { max-width: 14rem; }
    button, .button { background: var(--accent); color: #fff; border: 0; padding: .5rem 1rem; border-radius: 4px; cursor: pointer; font: inherit; text-decoration: none; }
    button.secondary { background: #fff; color: var(--accent); border: 1px solid var(--accent); padding: .25rem .7rem; font-size: .9rem; }
    button + a, .button + a { margin-left: .9rem; }
    select { font: inherit; padding: .2rem; max-width: 100%; }
    .confirmed { margin-top: -.25rem; }
    .line-row.flagged { background: #fdf6ee; }
    .line-row.flagged td:first-child { box-shadow: inset 4px 0 var(--warn); }
    td.ai.superseded { opacity: .5; }
    td form + form { margin-top: .3rem; }
    /* On a narrow screen each row of a card table becomes a stacked card, labelled field by field. */
    @media (max-width: 640px) {
      table.cards, table.cards tbody { display: block; }
      table.cards thead { display: none; }
      table.cards select { width: 100%; }
      table.cards tr { display: block; border-bottom: 1px solid var(--line); padding: .5rem 0; }
      table.cards td { display: block; border: 0; padding: .15rem 0; text-align: left; }
      table.cards td[data-label]::before { content: attr(data-label); display: block; font-size: .75rem; color: var(--muted); font-weight: 600; }
      table.cards td.num { display: inline-block; margin-right: 1.5rem; }
      table.cards td[data-label="Field"]::before { display: none; }
      table.cards td[data-label="#"] { font-weight: 600; }
      table.cards td[data-label="#"]::before { content: "Line"; display: inline; margin-right: .4rem; }
      .line-row.flagged td:first-child { box-shadow: none; }
      .line-row.flagged { box-shadow: inset 4px 0 var(--warn); padding-left: .6rem; }
      .picker select, .picker input { max-width: 100%; width: 100%; }
    }
  </style>
</head>
<body>
  <header><a href="/">Invoice ingestion</a><span class="muted">Clinical trial site invoices</span></header>
  {% block content %}{% endblock %}
</body>
</html>
